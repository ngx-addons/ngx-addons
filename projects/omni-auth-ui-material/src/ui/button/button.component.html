<button
  class="button"
  mat-flat-button
  omniAuthUiMatLoadingOverlay
  [class.icon-only]="iconOnly()"
  [disabled]="disabled() || loading()"
  [loading]="loading()"
  [ngClass]="type()"
  [type]="buttonType()"
>
  @if (icon(); as icon) {
    @if (iconComponent) {
      <ng-container *ngComponentOutlet="iconComponent; inputs: { icon }"/>
    } @else {
      <span class="icon">{{ icon }}</span>
    }
  }
  <ng-content/>
</button>
