<div class="message-outer">
  <div class="message-inner" [ngClass]="type()">
    @if (iconComponent) {
      <ng-container *ngComponentOutlet="iconComponent; inputs: { icon: icon() ?? iconBasedOnType }"/>
    } @else {
      <span class="icon">{{ icon() ?? iconBasedOnType }}</span>
    }
    <div class="message-content">
      <ng-content/>
    </div>
  </div>
</div>
